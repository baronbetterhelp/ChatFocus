name = "chatfocus"
main = "src/worker.js"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chatfocus-db"
database_id = "20dfa551-7b78-4c86-bc61-60f8a38e97f8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "chatfocus-files"

[vars]
APP_NAME = "ChatFocus"
OPENAI_MODEL = "gpt-6-luna"
ADMIN_EMAIL = ""
SESSION_DAYS = "30"
MAX_UPLOAD_MB = "18"
MAX_ATTACHMENTS = "10"

[triggers]
crons = ["*/15 * * * *"]
